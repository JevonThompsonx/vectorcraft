# Generated by zLeafNinja/ci-workflows — do not hand-edit.
# Change the template there and re-run sync_ci.py; local edits are overwritten.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: rust · fmt/clippy/test/build
    runs-on: forgejo-ci
    steps:
      - uses: actions/checkout@v4
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --all
      - name: cargo build
        run: cargo build --locked
