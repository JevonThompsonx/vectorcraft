# Generated by zLeafNinja/ci-workflows — do not hand-edit.
# Change the template there and re-run sync_ci.py; local edits are overwritten.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# NOTE: no top-level `permissions:` block. Forgejo does not implement it and
# warns "has a permissions field which is not supported ... and will be ignored".

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: rust · fmt/clippy/test/build
    runs-on: forgejo-ci
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal \
            --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: cargo fmt
        run: export PATH="$HOME/.cargo/bin:$PATH"; cargo fmt --all -- --check
      - name: cargo clippy
        run: export PATH="$HOME/.cargo/bin:$PATH"; cargo clippy --all-targets
      - name: cargo test
        run: export PATH="$HOME/.cargo/bin:$PATH"; cargo test --all
      - name: cargo build
        run: export PATH="$HOME/.cargo/bin:$PATH"; cargo build --locked
